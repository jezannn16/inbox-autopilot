<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="inbox-title inbox-desc">
  <title id="inbox-title">Inbox Autopilot</title>
  <desc id="inbox-desc">A local-first inbox workflow where incoming messages become organized threads, explicit action items, and private reply drafts.</desc>
  <defs>
    <linearGradient id="inbox-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="inbox-lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2FF92"/>
      <stop offset="1" stop-color="#B7F36B"/>
    </linearGradient>
    <pattern id="inbox-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#9CAAC2" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#inbox-bg)"/>
