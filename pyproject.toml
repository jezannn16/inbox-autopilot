[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-autopilot"
version = "0.1.0"
description = "Read-only Gmail and .eml inbox organizer with local action items and drafts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
]

[project.scripts]
inbox-autopilot = "app:main"

[tool.setuptools]
py-modules = ["app", "gmail_provider", "migrations"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
